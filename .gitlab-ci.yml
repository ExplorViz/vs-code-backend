image: node:20-slim

include:
  - project: 'ExplorViz/code/deployment'
    file: '.gitlab-ci-docker-manifest.yml'

cache:
  paths:
    - node_modules/
    - .npm/

stages:
  - code-analysis
  - test

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: "$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS"
      when: never
    - if: "$CI_COMMIT_BRANCH"

linting:
  stage: code-analysis
  tags:
    - exec-docker
  before_script:
    - npm install
  script:
    - npm run lint

test:
  stage: test
  tags:
    - exec-docker
  script:
    - npm install
    - npm run test
