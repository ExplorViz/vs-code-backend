services:
  vs-code-backend:
    build: .
    ports:
      - "3000:3000"
    environment:
      MONGO_URL: mongodb://mongo:${MONGO_PORT:-27018}
    depends_on:
      mongo:
        condition: service_healthy

  mongo:
    image: mongo:7
    command: ["mongod", "--bind_ip_all", "--port", "${MONGO_PORT:-27018}"]
    ports:
      - "${MONGO_PORT:-27018}:${MONGO_PORT:-27018}"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--port", "${MONGO_PORT:-27018}", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mongo-data:
